name: old-calculator-local

services:
  calculator:
    build:
      context: .
    image: old-calculator-local:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-4873}:4873"
    environment:
      FLAG: "${FLAG:-}"
      CALCULATOR_MODE: "${CALCULATOR_MODE:-random}"
      CALCULATOR_SEED: "${CALCULATOR_SEED:-}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
